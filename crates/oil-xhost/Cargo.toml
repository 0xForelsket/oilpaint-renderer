[package]
name = "oil-xhost"
description = "Cross-host determinism cases: the same Rust code run natively and as WASM in Node and browsers (ci/xhost)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xhost"
path = "src/bin/xhost.rs"

[dependencies]
oil-math = { path = "../oil-math" }
oil-kernel = { path = "../oil-kernel" }
oil-mix = { path = "../oil-mix" }
# Mixbox (CC BY-NC 4.0) is in the determinism test build only; oil-xhost is never published.
oil-mix-mixbox = { path = "../oil-mix-mixbox" }
oil-paint = { path = "../oil-paint" }
oil-light = { path = "../oil-light" }
oil-strokes = { path = "../oil-strokes" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.10"

[lints]
workspace = true
