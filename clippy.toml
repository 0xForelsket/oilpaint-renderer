# Determinism (docs/plans/LIBRARY_PLAN.md, section 5): anything that can reach a pixel or a stroke must use
# oil-math, never the platform libm, whose results differ between native targets and WASM. Tests that compare
# oil-math against the platform libm opt out with #[allow(clippy::disallowed_methods)].
disallowed-methods = [
    { path = "f32::exp", reason = "platform libm; use oil_math" },
    { path = "f64::exp", reason = "platform libm; use oil_math" },
    { path = "f32::exp2", reason = "platform libm; use oil_math" },
    { path = "f64::exp2", reason = "platform libm; use oil_math" },
    { path = "f32::exp_m1", reason = "platform libm; use oil_math" },
    { path = "f64::exp_m1", reason = "platform libm; use oil_math" },
    { path = "f32::ln", reason = "platform libm; use oil_math" },
    { path = "f64::ln", reason = "platform libm; use oil_math" },
    { path = "f32::log", reason = "platform libm; use oil_math" },
    { path = "f64::log", reason = "platform libm; use oil_math" },
    { path = "f32::log2", reason = "platform libm; use oil_math" },
    { path = "f64::log2", reason = "platform libm; use oil_math" },
    { path = "f32::log10", reason = "platform libm; use oil_math" },
    { path = "f64::log10", reason = "platform libm; use oil_math" },
    { path = "f32::ln_1p", reason = "platform libm; use oil_math" },
    { path = "f64::ln_1p", reason = "platform libm; use oil_math" },
    { path = "f32::powf", reason = "platform libm; use oil_math" },
    { path = "f64::powf", reason = "platform libm; use oil_math" },
    { path = "f32::powi", reason = "precision is not specified across targets; multiply explicitly" },
    { path = "f64::powi", reason = "precision is not specified across targets; multiply explicitly" },
    { path = "f32::sin", reason = "platform libm; use oil_math" },
    { path = "f64::sin", reason = "platform libm; use oil_math" },
    { path = "f32::cos", reason = "platform libm; use oil_math" },
    { path = "f64::cos", reason = "platform libm; use oil_math" },
    { path = "f32::tan", reason = "platform libm; use oil_math" },
    { path = "f64::tan", reason = "platform libm; use oil_math" },
    { path = "f32::sin_cos", reason = "platform libm; use oil_math" },
    { path = "f64::sin_cos", reason = "platform libm; use oil_math" },
    { path = "f32::asin", reason = "platform libm; use oil_math" },
    { path = "f64::asin", reason = "platform libm; use oil_math" },
    { path = "f32::acos", reason = "platform libm; use oil_math" },
    { path = "f64::acos", reason = "platform libm; use oil_math" },
    { path = "f32::atan", reason = "platform libm; use oil_math" },
    { path = "f64::atan", reason = "platform libm; use oil_math" },
    { path = "f32::atan2", reason = "platform libm; use oil_math" },
    { path = "f64::atan2", reason = "platform libm; use oil_math" },
    { path = "f32::sinh", reason = "platform libm; use oil_math" },
    { path = "f64::sinh", reason = "platform libm; use oil_math" },
    { path = "f32::cosh", reason = "platform libm; use oil_math" },
    { path = "f64::cosh", reason = "platform libm; use oil_math" },
    { path = "f32::tanh", reason = "platform libm; use oil_math" },
    { path = "f64::tanh", reason = "platform libm; use oil_math" },
    { path = "f32::cbrt", reason = "platform libm; use oil_math" },
    { path = "f64::cbrt", reason = "platform libm; use oil_math" },
    { path = "f32::hypot", reason = "platform libm; use oil_math" },
    { path = "f64::hypot", reason = "platform libm; use oil_math" },
    { path = "f32::mul_add", reason = "FMA is not available on every target; results differ" },
    { path = "f64::mul_add", reason = "FMA is not available on every target; results differ" },
]
