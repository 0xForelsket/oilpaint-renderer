<!doctype html>
<meta charset="utf-8">
<title>oilpaint xhost</title>
<script type="module">
  import { importsOf, runXhost } from "./wasm-host.mjs";
  const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  // WebCrypto may not accept a view on WASM memory in every engine: hash a copy.
  const sha = async (bytes) => hex(await crypto.subtle.digest("SHA-256", bytes.slice()));
  window.runXhost = async () => {
    const { module, instance } = await WebAssembly.instantiateStreaming(fetch("./oil_xhost.wasm"), {});
    const imports = importsOf(module);
    if (imports.length) throw new Error(`oil_xhost.wasm must not import anything, found: ${imports.join(", ")}`);
    return runXhost(instance, sha, () => performance.now());
  };
  window.xhostReady = true;
</script>
